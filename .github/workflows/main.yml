name: Trigger EdgePulse Auto Refresh

on:
  schedule:
    # UTC 时间每 4 小时第 15 分钟触发一次 (对应北京时间 00:15, 04:15, 08:15, 12:15, 16:15, 20:15)
    - cron: '15 */4 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮立即运行测试

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger URL and exit
        run: |
          echo "Triggering URL..."
          # 发出 POST 请求后直接退出，不关心返回什么内容和状态码
          curl -s -X POST -m 15 "https://e48fa153.v20251104-dj6.pages.dev/update?token=yuanzhou029" || true
          echo "Trigger request sent. Exiting workflow."
